<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Move to folder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <div class="title" id="heading" style="margin-top: 2px">Move to folder</div>
    <input type="search" id="filter" placeholder="Type to find a folder…" autofocus>
    <div class="folder-list" id="list"></div>
    <div id="status" class="status"></div>
    <div class="muted" style="font-size: 11.5px">↑ ↓ to choose · Enter to move · Esc to close</div>
  </div>
  <script src="move.js"></script>
</body>
</html>
